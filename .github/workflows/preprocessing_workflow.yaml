name: Automated Preprocessing

on:
  push:
    paths:
      - 'winequality-red.csv' # Trigger saat data raw berubah

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Automation Script
        run: python preprocessing/automate_Muhammad-Alif-Aditya.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/winequality_preprocessed.csv
          git commit -m "Update preprocessed data otomatis" || echo "Tidak ada perubahan"
          git push